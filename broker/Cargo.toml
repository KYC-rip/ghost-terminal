[package]
name = "ripley-vpn-broker"
version = "0.1.0"
edition = "2021"
description = "Root-owned WireGuard + kill-switch broker for the RipleyOS VPN panel. The ONLY privileged component: it accepts structured operations over a peer-credential-checked Unix socket and never executes caller-supplied strings. See ../docs/vpn-panel.md."
license = "MIT"

[[bin]]
name = "ripley-vpn-broker"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", features = ["socket", "user", "fs"] }
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
strip = true
lto = true
