name: Tauri Build

# Builds the pure-Rust Tauri app (NOT the legacy Electron build in build.yml).
# Trigger manually (Actions tab → "Run workflow") to get the per-platform bundles —
# notably the Linux AppImage needed to verify OpsHub #406 on Qubes/Whonix.
# Pushing a `tauri-v*` tag produces a draft GitHub release with the bundles attached.
on:
  workflow_dispatch:
  push:
    branches:
      # Build the migration branch on every push so release-build breaks (e.g. the
      # recursion_limit overflow) surface in CI immediately. Scope down to `main`
      # once the migration merges.
      - feat/tauri-migration
    tags:
      - 'tauri-v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon (aarch64) — verified locally: 15 MB dmg
            rust_target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-13           # Intel (x86_64)
            rust_target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04       # Linux AppImage + .deb (22.04 → broad glibc compat)
            rust_target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest     # NSIS .exe + .msi
            rust_target: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 system deps (Linux). WebKitGTK 4.1 is the system webview that replaces
      # Electron's bundled Chromium — this is why the bundle is ~15 MB not ~150 MB.
      # NOTE (OpsHub #406): the AppImage produced here depends on webkit2gtk-4.1 at
      # RUNTIME. Verify self-containment on Debian 13 / trixie (Whonix workstation) —
      # if the target lacks libwebkit2gtk-4.1, either require it or bundle it.
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf build-essential curl wget file libssl-dev libxdo-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: pnpm install

      # tauri-action runs the frontend build (beforeBuildCommand: `npm run build:renderer`)
      # + `tauri build` + bundling, and (on a tag) uploads bundles to a draft release.
      # macOS signing/notarization (OpsHub #14): unset → UNSIGNED builds. To sign+notarize,
      # add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
      # APPLE_PASSWORD, APPLE_TEAM_ID secrets (tauri-action reads them automatically).
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/tauri-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/tauri-v') && format('Ripley Terminal {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      # On manual (non-tag) runs, attach the bundles as workflow artifacts so the
      # Linux AppImage etc. can be downloaded without cutting a release. The `--target`
      # macOS builds nest under target/<triple>/, hence the `**` glob.
      - name: Upload bundles as artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: ignore
