name: Tauri Build

# Builds the pure-Rust Tauri app (NOT the legacy Electron build in build.yml).
# Trigger manually (Actions tab → "Run workflow") to get the per-platform bundles —
# notably the Linux AppImage needed to verify OpsHub #406 on Qubes/Whonix.
# Pushing a `tauri-v*` tag produces a draft GitHub release with the bundles attached.
on:
  workflow_dispatch:
  push:
    branches:
      # Build the migration branch on every push so release-build breaks (e.g. the
      # recursion_limit overflow) surface in CI immediately. Scope down to `main`
      # once the migration merges.
      - feat/tauri-migration
    tags:
      - 'tauri-v*'

jobs:
  build-tauri:
    permissions:
      contents: write
      id-token: write       # OIDC token for keyless build-provenance attestation
      attestations: write   # write the attestation to the repo's attestation store
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE universal build (arm64 + Intel, lipo'd) on the arm64 runner. Drops the
          # separate macos-13 (Intel) leg, whose free-tier runner sits in GitHub's queue
          # for 30+ min and stalls the checksums job (needs: ALL legs). Universal =>
          # one .dmg that runs on every Mac, and no Intel-runner wait.
          - platform: macos-latest      # universal-apple-darwin — verified locally: 15 MB dmg
            rust_target: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04       # Linux AppImage + .deb (22.04 → broad glibc compat)
            rust_target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest     # NSIS .exe + .msi
            rust_target: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 system deps (Linux). WebKitGTK 4.1 is the system webview that replaces
      # Electron's bundled Chromium — this is why the bundle is ~15 MB not ~150 MB.
      # NOTE (OpsHub #406): the AppImage produced here depends on webkit2gtk-4.1 at
      # RUNTIME. Verify self-containment on Debian 13 / trixie (Whonix workstation) —
      # if the target lacks libwebkit2gtk-4.1, either require it or bundle it.
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf build-essential curl wget file libssl-dev libxdo-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # The @kyc-rip/stealth-engines git dependency is now a PUBLIC repo, so pnpm's
      # `git fetch` needs no credentials — no PAT/secret required.
      - name: Install frontend deps
        # --ignore-scripts skips the root `postinstall` (electron-builder
        # install-app-deps) — Electron-only, fails on CI runners, irrelevant to the
        # Tauri build. Vite/esbuild/rollup ship platform binaries via optional deps,
        # not install scripts, so the frontend build (beforeBuildCommand) is unaffected.
        run: pnpm install --ignore-scripts

      # tauri-action runs the frontend build (beforeBuildCommand: `npm run build:renderer`)
      # + `tauri build` + bundling, and (on a tag) uploads bundles to a draft release.
      # Builds are intentionally UNSIGNED (OpsHub #14): code-signing would dox the
      # pseudonymous author (Apple Developer ID / a Windows CA cert both require a legal
      # identity). Trust is anchored instead on KEYLESS build-provenance attestation (the
      # `Attest build provenance` step below) + the SHA256SUMS + reproducible builds;
      # users bypass the one-time OS warning per INSTALL.md. Do NOT add APPLE_*/signing
      # secrets here.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/tauri-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/tauri-v') && format('Ripley Terminal {0}', github.ref_name) || '' }}
          releaseDraft: true
          # Mark -beta / -rc tags as prereleases so the website (and the GitHub UI)
          # can keep them OFF the main/stable download and behind a beta channel.
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

      # Always attach the bundles as workflow artifacts: lets you download any platform
      # (e.g. the Linux .AppImage for #406) without cutting a release, AND feeds the
      # `checksums` job below. The `--target` macOS builds nest under target/<triple>/,
      # hence the `**` glob.
      - name: Upload bundles as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: ignore

      # Build-provenance attestation — KEYLESS, no secrets. Binds each bundle to this
      # repo's workflow + commit via GitHub OIDC + the Sigstore transparency log. This is
      # the primary tamper-evidence anchor for the unsigned release (replaces needing an
      # author GPG key for v1). Users verify with:
      #   gh attestation verify <file> --repo KYC-rip/ripley-terminal
      # Each platform leg attests only the bundles it produced; non-matching globs are
      # simply empty, so the same path list is safe on every platform.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi

  # Aggregate every platform's bundles into one SHA256SUMS — a convenience integrity
  # file for UNSIGNED releases. Tamper-evidence is anchored by the per-bundle build
  # provenance attestation above (gh attestation verify); this SHA256SUMS lets users
  # cross-check all files in one shot. An author GPG signature MAY be layered on later
  # (sign SHA256SUMS offline, publish SHA256SUMS.asc) — not required for v1.
  # See INSTALL.md for the user-side verify + per-platform install steps.
  checksums:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Compute SHA256SUMS
        run: |
          mkdir -p out
          find dist-artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -exec cp -n {} out/ \;
          ( cd out && sha256sum * > ../SHA256SUMS )
          echo "----- SHA256SUMS -----"; cat SHA256SUMS

      - name: Upload SHA256SUMS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: SHA256SUMS

      # On a tauri-v* release tag, attach the checksums to the draft release tauri-action created.
      - name: Attach SHA256SUMS to release
        if: startsWith(github.ref, 'refs/tags/tauri-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" SHA256SUMS --clobber --repo "${{ github.repository }}"
